server:
  port: 8083

spring:
  application:
    name: gestion-perfiles
  datasource:
    url: jdbc:h2:mem:profiles;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Authentication configuration
# Option A: Use external issuer or JWK set (recommended for prod). Uncomment and set accordingly:
# spring:
#   security:
#     oauth2:
#       resourceserver:
#         jwt:
#           issuer-uri: http://localhost:8080/realms/your-realm
#           # or
#           # jwk-set-uri: http://localhost:8080/realms/your-realm/protocol/openid-connect/certs

# Option B: Symmetric HS256 secret for local/dev fallback
jwt:
  secret: dev-secret-please-change

springdoc:
  swagger-ui:
    path: /swagger-ui
  api-docs:
    path: /v3/api-docs
