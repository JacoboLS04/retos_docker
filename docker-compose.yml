version: "3.8"
services:
  retos-spring-app:
    build: .
    container_name: retos-spring-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/retosdb
      - SPRING_DATASOURCE_USERNAME=retos_user
      - SPRING_DATASOURCE_PASSWORD=retos_pass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=U7t8C34aqstQ6soj1Bub9JYk7Y4BnNT3
      - JWT_EXPIRATION_SECONDS=3600
      - SPRING_MAIL_HOST=mailhog
      - SPRING_MAIL_PORT=1025
      - SPRING_MAIL_USERNAME=santiago.londonog@uqvirtual.edu.co
      - SPRING_MAIL_PASSWORD=xvyz hhon jptr xxid
    depends_on:
      - postgres
      - mailhog

  postgres:
    image: postgres:15
    container_name: retos-postgres
    environment:
      - POSTGRES_DB=retosdb
      - POSTGRES_USER=retos_user
      - POSTGRES_PASSWORD=retos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog
    container_name: retos-mailhog
    ports:
      - "8025:8025"   # UI
      - "1025:1025"   # SMTP

volumes:
  postgres-data:
