version: "3.8"
services:
  retos-spring-app:
    build: .
    container_name: retos-spring-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/retosdb
      - SPRING_DATASOURCE_USERNAME=retos_user
      - SPRING_DATASOURCE_PASSWORD=retos_pass
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=U7t8C34aqstQ6soj1Bub9JYk7Y4BnNT3
      - JWT_EXPIRATION_SECONDS=3600

      # 🔹 Configuración Gmail
      #- SPRING_MAIL_HOST=smtp.gmail.com
      #- SPRING_MAIL_PORT=587
      #- SPRING_MAIL_USERNAME=londgav01@gmail.com
      #- SPRING_MAIL_PASSWORD=dgcp rgve sazl arhk   # tu app password de Gmail
      #- SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      #- SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      # 🔹 Configuración SendGrid
      - SPRING_MAIL_HOST=smtp.sendgrid.net
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=apikey
      - SPRING_MAIL_PASSWORD=${SENDGRID_API_KEY}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true

      # Twilio
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE=${TWILIO_PHONE}


      # RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest

    depends_on:
      - postgres
      - rabbitmq

  postgres:
    image: postgres:15
    container_name: retos-postgres
    environment:
      - POSTGRES_DB=retosdb
      - POSTGRES_USER=retos_user
      - POSTGRES_PASSWORD=retos_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  orchestrator-db:
    image: postgres:15
    container_name: orchestrator-postgres
    environment:
      - POSTGRES_DB=orchestrator_db
      - POSTGRES_USER=retos_user
      - POSTGRES_PASSWORD=retos_pass
    ports:
      - "5433:5432"
    volumes:
      - orchestrator-data:/var/lib/postgresql/data

  notifications-db:
    image: postgres:15
    container_name: notifications-postgres
    environment:
      - POSTGRES_DB=notifications_db
      - POSTGRES_USER=retos_user
      - POSTGRES_PASSWORD=retos_pass
    ports:
      - "5434:5432"
    volumes:
      - notifications-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: retos-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672" # puerto de conexión
      - "15672:15672" # dashboard en http://localhost:15672 (user/pass = guest/guest)
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build: C:\Users\londg\WebstormProjects\notification-orchestrator
    container_name: notification-orchestrator
    depends_on:
      rabbitmq:
        condition: service_healthy
      orchestrator-db:
        condition: service_started
    environment:
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672
      - USER_EVENTS_QUEUE=user.events.queue
      - NOTIFICATION_EVENTS_QUEUE=notification.events.queue

      # 🔹 Configuración DB Orchestrator
      - DB_HOST=orchestrator-db
      - DB_PORT=5432
      - DB_NAME=orchestrator_db
      - DB_USER=retos_user
      - DB_PASSWORD=retos_pass
    command: ["node","dist/index.js"]
    restart: always


  ms-notifications:
    build: C:\Users\londg\PycharmProjects\ms-notifications
    container_name: ms-notifications
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifications-db:
        condition: service_started
    environment:
      - RABBIT_HOST=rabbitmq
      - NOTIFICATION_EVENTS_QUEUE=notification.events.queue
      - DB_HOST=notifications-db
      - DB_PORT=5432
      - DB_NAME=notifications_db
      - DB_USER=retos_user
      - DB_PASS=retos_pass
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDER_EMAIL=londgav01@gmail.com
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE=${TWILIO_PHONE}
    restart: always

  # Jenkins (CI)
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: retos-jenkins
    restart: unless-stopped
    ports:
      - "8090:8080"   # UI en http://localhost:8090
      - "50000:50000" # Puerto de agentes (JNLP)
    volumes:
      - jenkins-data:/var/jenkins_home

  # SonarQube Database (PostgreSQL)
  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=sonar
      - POSTGRES_PASSWORD=sonar
      - POSTGRES_DB=sonarqube
    volumes:
      - sonarqube_db:/var/lib/postgresql/data

  # SonarQube (Calidad de código)
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"   # UI en http://localhost:9000
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
volumes:
  postgres-data:
  orchestrator-data:
  notifications-data:
  jenkins-data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

