#cucumber.plugin=pretty, summary, html:build/reports/cucumber-report.html, json:build/reports/cucumber-report.json, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
#cucumber.glue=co.edu.uniquindio.retos.steps,co.edu.uniquindio.retos.utils
#cucumber.publish.enabled=false
# Ruta a las features (usa esquema de paquete, no ruta del sistema)
cucumber.glue=co.edu.uniquindio.retos.steps ,co.edu.uniquindio.retos.utils
cucumber.features=classpath:co/edu/uniquindio/retos/features
cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm
cucumber.publish.quiet=true
cucumber.execution.parallel.enabled=false
cucumber.execution.parallel.config.fixed.parallelism=1
cucumber.execution.strict=true
cucumber.features.encoding=UTF-8


